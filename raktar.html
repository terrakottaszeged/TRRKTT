<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#122B5D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151E2F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raktár">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Terrakotta raktár</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F3F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --ink:#16202F; --muted:#63718B; --line:#DCE3EC;
  --navy:#122B5D; --teal:#1E8FA0; --teal-soft:#E4F1F4;
  --ok:#2F8C56; --ok-bg:#E4F2E9;
  --wait:#B57B0A; --wait-bg:#FBF0D9;
  --no:#BC2E24; --no-bg:#FAE3E1;
  --shadow:0 1px 2px rgba(18,43,93,.07), 0 6px 18px rgba(18,43,93,.06);
  --band:#12315F; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.74);
  --band-num:#6FD3E4; --band-track:rgba(255,255,255,.24);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1422; --surface:#151E2F; --surface-2:#1C2739;
    --ink:#E6ECF5; --muted:#92A2BC; --line:#27334A;
    --navy:#8FB0E8; --teal:#4FC3D6; --teal-soft:#16303A;
    --ok:#6BC98C; --ok-bg:#16301F;
    --wait:#E0AE44; --wait-bg:#33260C;
    --no:#F08379; --no-bg:#361714;
    --band:#233860; --band-ink:#E6ECF5; --band-soft:#9DAFCB;
    --band-num:#4FC3D6; --band-track:#2C3C57; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1422; --surface:#151E2F; --surface-2:#1C2739;
  --ink:#E6ECF5; --muted:#92A2BC; --line:#27334A;
  --navy:#8FB0E8; --teal:#4FC3D6; --teal-soft:#16303A;
  --ok:#6BC98C; --ok-bg:#16301F;
  --wait:#E0AE44; --wait-bg:#33260C;
  --no:#F08379; --no-bg:#361714;
  --band:#233860; --band-ink:#E6ECF5; --band-soft:#9DAFCB;
  --band-num:#4FC3D6; --band-track:#2C3C57; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%; height:100dvh}
body{overflow:hidden; overscroll-behavior:none; margin:0;
  background:var(--ground); color:var(--ink);
  font-family:"Barlow","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.4; -webkit-text-size-adjust:100%}
.app{display:flex; flex-direction:column; height:100%}

header{position:relative; z-index:20;
  background:var(--navy); color:#fff;
  padding:calc(9px + env(safe-area-inset-top,0px)) 14px 8px;
  display:grid; grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center; gap:1px 10px}
:root[data-theme="dark"] header,
:root:not([data-theme="light"]) header{background:var(--surface)}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) header{background:#122B5D}
}
.logo{grid-column:1; grid-row:1 / span 2; display:flex; align-items:center;
  justify-content:center; width:36px; height:36px; background:#fff;
  border-radius:9px; padding:4px}
.logo img{width:100%; height:100%; object-fit:contain; display:block}
.logo:empty,.logo.nincs{display:none}
header h1{grid-column:2; grid-row:1; margin:0;
  font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:700;
  font-size:18px; letter-spacing:.04em; text-transform:uppercase; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
:root[data-theme="dark"] header h1{color:var(--ink)}
header .stamp{grid-column:2; grid-row:2; font-size:11.5px; opacity:.72;
  color:#fff; overflow-wrap:anywhere}
:root[data-theme="dark"] header .stamp{color:var(--muted); opacity:1}
.hbtn{grid-column:3; grid-row:1 / span 2; justify-self:end; font:inherit;
  font-size:12.5px; font-weight:600; line-height:1; padding:7px 11px;
  border-radius:999px; cursor:pointer; border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.12); color:#fff; white-space:nowrap}
:root[data-theme="dark"] .hbtn{border-color:var(--line); color:var(--ink);
  background:var(--surface-2)}
.back{grid-column:1; grid-row:1 / span 2; width:36px; height:36px;
  border-radius:9px; border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12); color:#fff; font-size:20px;
  cursor:pointer; display:flex; align-items:center; justify-content:center}
:root[data-theme="dark"] .back{border-color:var(--line); color:var(--ink);
  background:var(--surface-2)}

main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(26px + env(safe-area-inset-bottom,0px))}

.sync{display:flex; align-items:center; gap:7px; font-size:12.5px;
  padding:7px 12px; border-radius:9px; margin-bottom:12px;
  background:var(--surface-2); color:var(--muted)}
.sync.kuld{background:var(--wait-bg); color:var(--wait)}
.sync.baj{background:var(--no-bg); color:var(--no)}
.sync.kesz{background:var(--ok-bg); color:var(--ok)}
.sync button{margin-left:auto; font:inherit; font-size:12px; font-weight:600;
  border:1px solid currentColor; background:none; color:inherit;
  border-radius:999px; padding:3px 10px; cursor:pointer}

.truck{display:block; width:100%; text-align:left; font:inherit;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  box-shadow:var(--shadow); margin-bottom:11px; overflow:hidden;
  cursor:pointer; padding:0; color:inherit}
.thead{padding:11px 14px; display:grid; grid-template-columns:1fr auto;
  gap:3px 12px; background:var(--band); color:var(--band-ink)}
.tname{font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:600;
  font-size:18px; letter-spacing:.02em; overflow-wrap:anywhere}
.tnum{color:var(--band-num); margin-right:6px; font-weight:700}
.teta{font-size:12.5px; color:var(--band-soft); grid-column:1}
.tcount{font-size:12.5px; color:var(--band-soft); text-align:right;
  grid-column:2; white-space:nowrap}
.meter{grid-column:1 / -1; height:5px; border-radius:3px;
  background:var(--band-track); margin-top:8px; overflow:hidden; display:flex}
.meter i{display:block; height:100%}
.meter i.m-ok{background:#5BD08A} .meter i.m-hiba{background:#E8B44A}
.meter i.m-nincs{background:#F08379}
.tsum{display:flex; gap:10px; flex-wrap:wrap; padding:9px 14px;
  font-size:12.5px; color:var(--muted)}
.tsum b{font-weight:600}
.tsum .s-ok{color:var(--ok)} .tsum .s-hiba{color:var(--wait)}
.tsum .s-nincs{color:var(--no)}

.grp{margin:0 -14px}
.ghead{padding:7px 14px 6px; background:var(--surface-2); color:var(--navy);
  font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:700;
  font-size:15px; text-transform:uppercase; letter-spacing:.06em;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  position:sticky; top:-14px; z-index:5}
:root[data-theme="dark"] .ghead{color:var(--ink)}
.ghead b{font-family:"Barlow",sans-serif; font-weight:500; font-size:11.5px;
  color:var(--muted); text-transform:none; letter-spacing:0; white-space:nowrap}
.item{background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 14px}
.item.v-ok{background:var(--ok-bg)}
.item.v-hiba{background:var(--wait-bg)}
.item.v-nincs{background:var(--no-bg)}
.prod{font-weight:600; overflow-wrap:anywhere}
.meta{font-size:13px; color:var(--muted); overflow-wrap:anywhere; margin-top:1px}
.meta .pf{font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink)}
.states{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;
  margin-top:9px}
.states button{font:inherit; font-size:13px; font-weight:600; padding:11px 4px;
  border-radius:10px; border:1px solid var(--line); background:var(--surface);
  color:var(--muted); cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; line-height:1.15; min-height:54px}
.states button .g{font-size:17px; line-height:1}
.states button[aria-pressed="true"].b-ok{background:var(--ok);
  border-color:var(--ok); color:#fff}
.states button[aria-pressed="true"].b-hiba{background:var(--wait);
  border-color:var(--wait); color:#fff}
.states button[aria-pressed="true"].b-nincs{background:var(--no);
  border-color:var(--no); color:#fff}
.note{margin-top:8px; font-size:13px; background:var(--surface);
  border:1px dashed var(--line); border-radius:9px; padding:8px 10px;
  color:var(--ink)}
.note b{font-weight:600}
.note a{color:var(--teal)}
.note button{font:inherit; font-size:12px; font-weight:600; margin-top:6px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
  border-radius:999px; padding:3px 10px; cursor:pointer}
.note img{max-width:100%; border-radius:8px; margin-top:7px; display:block}

.empty{color:var(--muted); text-align:center; padding:34px 6px}
h2.sec{font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:600;
  text-transform:uppercase; letter-spacing:.07em; font-size:13px;
  color:var(--muted); margin:16px 0 8px}

.sheetwrap{position:fixed; inset:0; z-index:40; display:flex;
  align-items:flex-end; justify-content:center; background:rgba(10,18,32,.55)}
.sheet{background:var(--surface); color:var(--ink); width:100%;
  max-width:560px; border-radius:14px 14px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow); max-height:92vh; overflow-y:auto}
.sheet h3{margin:0 0 4px; font-family:"Barlow Condensed","Barlow",sans-serif;
  font-size:19px; letter-spacing:.02em; text-transform:uppercase;
  color:var(--navy)}
:root[data-theme="dark"] .sheet h3{color:var(--ink)}
.sheet .sub{font-size:13px; color:var(--muted); margin:0 0 14px;
  overflow-wrap:anywhere}
.opts{display:flex; flex-direction:column; gap:8px; margin-bottom:13px}
.opt{display:flex; align-items:center; gap:10px; padding:11px 12px;
  border:1px solid var(--line); border-radius:10px; cursor:pointer;
  background:var(--surface)}
.opt input{width:20px; height:20px; accent-color:var(--teal)}
.opt[data-sel="1"]{border-color:var(--teal); background:var(--teal-soft)}
label.fld{display:block; font-size:12.5px; font-weight:600;
  color:var(--muted); margin:0 0 4px}
textarea,input[type=text]{width:100%; font:inherit; font-size:16px;
  padding:10px 12px; border:1px solid var(--line); border-radius:9px;
  background:var(--surface); color:var(--ink)}
textarea{min-height:68px; resize:vertical}
.fotobtn{margin-top:11px; width:100%; font:inherit; font-weight:600;
  font-size:15px; padding:12px; border-radius:10px; cursor:pointer;
  border:1px dashed var(--line); background:var(--surface-2);
  color:var(--ink); display:flex; align-items:center; justify-content:center;
  gap:8px}
.elonezet{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.elonezet figure{margin:0; position:relative}
.elonezet img{width:84px; height:84px; object-fit:cover; border-radius:9px;
  display:block; border:1px solid var(--line)}
.elonezet button{position:absolute; top:-7px; right:-7px; width:24px;
  height:24px; border-radius:50%; border:none; background:var(--no);
  color:#fff; font-size:14px; line-height:1; cursor:pointer}
.sheet-row{display:grid; grid-template-columns:1fr 1fr; gap:9px;
  margin-top:16px}
.sheet-ok,.sheet-mas{font:inherit; font-weight:600; font-size:15px;
  padding:13px; border-radius:10px; border:none; cursor:pointer}
.sheet-ok{background:var(--navy); color:#fff}
:root[data-theme="dark"] .sheet-ok{background:var(--teal); color:#08222A}
.sheet-mas{background:var(--surface-2); color:var(--ink)}
@media (min-width:560px){
  .sheetwrap{align-items:center}
  .sheet{border-radius:14px; margin:16px}
}
@media (min-width:760px){
  .app{max-width:760px; margin:0 auto}
  main{padding-left:20px; padding-right:20px}
  .grp{margin:0 -20px}
}
</style>
</head>

    return t ? JSON.parse(t) : alap;

}
function ir(kulcs, ertek){
  try { localStorage.setItem(kulcs, JSON.stringify(ertek)); } catch (e) {}
}

let allapotok = olvas(TAR, {});      // id -> {allapot, hiba, megjegyzes, fotok, ido}
let sorban = olvas(SOR, {});         // id -> jelentés, ami még nem ment el
let raktaros = olvas(NEV, '');
let nyitott = null;                  // a megnyitott kamion kulcsa
let szerk = null;                    // épp szerkesztett tétel

const $ = id => document.getElementById(id);
const kamionok = () => (DATA.kamionok || []);
const kamion = k => kamionok().find(t => t.kulcs === k);

/* ------------------------------------------------ küldés ---------------- */

let kuldfut = false;
let kuldhiba = '';

function allapotSav(){
  const n = Object.keys(sorban).length;
  const el = $('sync');
  if (!el) return;
  el.className = 'sync' + (n ? (kuldhiba ? ' baj' : ' kuld') : ' kesz');
  if (!n) {
    el.innerHTML = '<span>✓</span><span>Minden jelentés elment.</span>';
    return;
  }
  const szoveg = kuldhiba
    ? `${n} jelentés még nem ment el (${esc(kuldhiba)}).`
    : `${n} jelentés küldés alatt…`;
  el.innerHTML = `<span>${kuldhiba ? '⚠' : '⟳'}</span><span>${szoveg}</span>`
    + '<button type="button" id="ujra">Újra</button>';
  const b = $('ujra');
  if (b) b.addEventListener('click', () => kuld(true));
}

async function kuld(eros){
  const cel = (DATA.kuldes || {}).url;
  const idk = Object.keys(sorban);
  if (!cel || !idk.length || (kuldfut && !eros)) { allapotSav(); return; }
  kuldfut = true;
  const csomag = idk.slice(0, 8).map(id => sorban[id]);
  try {
    const v = await fetch(cel, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({kulcs: (DATA.kuldes || {}).kulcs || '',
                            raktaros: raktaros, tetelek: csomag})
    });
    const sz = await v.json();
    if (!sz || !sz.ok) throw new Error(sz && sz.hiba ? sz.hiba : 'hiba');
    csomag.forEach(t => { delete sorban[t.id]; });
    ir(SOR, sorban);
    kuldhiba = '';
  } catch (e) {
    kuldhiba = 'nincs internet';
  }
  kuldfut = false;
  allapotSav();
  if (Object.keys(sorban).length && !kuldhiba) setTimeout(() => kuld(), 400);
}

function jelent(it, a){
  const t = kamion(it.kamion) || {};
  const st = allapotok[it.id] || {};
  sorban[it.id] = {
    id: it.id + '-' + (st.ido || ''),
    tetel: it.id, tabla: it.tabla, sor: it.sor,
    orszag: t.orszag || '', kamion: t.cim || '',
    gyarto: it.gyarto, termek: it.termek, ugyfel: it.ugyfel,
    proforma: it.proforma, raktaros: raktaros,
    allapot: a.allapot, hiba: a.hiba || '',
    megjegyzes: a.megjegyzes || '',
    foto: (a.fotok || [])[0] || '', ido: st.ido || ''
  };
  // tobb fotonal mindegyik kulon sorban megy ki
  (a.fotok || []).slice(1).forEach((f, i) => {
    sorban[it.id + '#' + (i + 2)] = Object.assign({}, sorban[it.id], {
      id: it.id + '-' + (st.ido || '') + '-f' + (i + 2), foto: f,
      megjegyzes: (a.megjegyzes || '') + ' (fotó ' + (i + 2) + '.)'
    });
  });
  ir(SOR, sorban);
  kuld();
}

/* ------------------------------------------------ nézetek --------------- */

function tetelek(t){ return (t.tetelek || []); }

function szamol(t){
  const ki = {ok: 0, hiba: 0, nincs: 0, nincs_meg: 0};
  tetelek(t).forEach(it => {
    const a = (allapotok[it.id] || {}).allapot;
    if (a === 'ok') ki.ok++;
    else if (a === 'hiba') ki.hiba++;
    else if (a === 'nincs') ki.nincs++;
    else ki.nincs_meg++;
  });
  return ki;
}

function kamionKartya(t){
  const n = tetelek(t).length;
  const sz = szamol(t);
  const sav = ['ok', 'hiba', 'nincs'].map(k =>
    sz[k] ? `<i class="m-${k}" style="width:${sz[k] / n * 100}%"></i>` : ''
  ).join('');
  const reszek = [];
  if (sz.ok) reszek.push(`<span class="s-ok">✓ ${sz.ok} átvéve</span>`);
  if (sz.hiba) reszek.push(`<span class="s-hiba">⚠ ${sz.hiba} hibás</span>`);
  if (sz.nincs) reszek.push(`<span class="s-nincs">✖ ${sz.nincs} nem jött</span>`);
  reszek.push(`<span>${sz.nincs_meg} még nincs ellenőrizve</span>`);
  return `<button class="truck" type="button" data-k="${esc(t.kulcs)}">
    <div class="thead">
      <div class="tname"><span class="tnum">${esc(t.szam)}</span>${esc(t.fuvaros || 'kamion')}</div>
      <div class="tcount">${n} tétel</div>
      <div class="teta">${esc(t.orszag)}${t.mikor ? ' · ' + esc(t.mikor) : ''}</div>
      <div class="meter">${sav}</div>
    </div>
    <div class="tsum">${reszek.join('')}</div></button>`;
}

function kamionLista(){
  $('back').hidden = true;
  $('logo').hidden = false;
  $('cim').textContent = 'Terrakotta raktár';
  const sorok = kamionok().filter(t => tetelek(t).length);
  $('main').innerHTML = '<div class="sync" id="sync"></div>'
    + (sorok.length
       ? '<h2 class="sec">Válaszd ki, melyik kamiont pakoljátok</h2>'
         + sorok.map(kamionKartya).join('')
       : '<div class="empty">Most nincs tétel egyetlen kamionon sem.</div>');
  allapotSav();
  document.querySelectorAll('.truck').forEach(b =>
    b.addEventListener('click', () => { nyitott = b.dataset.k; rajzol(); }));
}

function jegyzet(it){
  const a = allapotok[it.id];
  if (!a || a.allapot === 'ok') return '';
  const reszek = [];
  if (a.allapot === 'hiba') {
    reszek.push('<b>' + esc(HIBA_NEV[a.hiba] || 'Hiba') + '</b>');
  } else {
    reszek.push('<b>Nem érkezett be</b>');
  }
  if (a.megjegyzes) reszek.push(esc(a.megjegyzes));
  const kepek = (a.fotok || []).map(f =>
    `<img src="${f}" alt="fotó">`).join('');
  return `<div class="note">${reszek.join(' — ')}${kepek}
    <button type="button" data-mod="${esc(it.id)}">Módosítás</button></div>`;
}

function tetelKartya(it){
  const a = (allapotok[it.id] || {}).allapot || '';
  const meta = [it.ugyfel, it.proforma
    ? `<span class="pf">${esc(it.proforma)}</span>` : ''].filter(Boolean);
  const gomb = (k, glif, cimke) =>
    `<button type="button" class="b-${k}" data-id="${esc(it.id)}" data-a="${k}"
      aria-pressed="${a === k}"><span class="g" aria-hidden="true">${glif}</span>
      ${cimke}</button>`;
  return `<div class="item${a ? ' v-' + a : ''}">
    <div class="prod">${esc(it.termek)}</div>
    <div class="meta">${meta.join(' · ')}</div>
    <div class="states">${gomb('ok', '✓', 'Átvéve')}${gomb('hiba', '⚠', 'Hiba')}
      ${gomb('nincs', '✖', 'Nem jött')}</div>
    ${jegyzet(it)}</div>`;
}

function tetelLista(){
  const t = kamion(nyitott);
  if (!t) { nyitott = null; return kamionLista(); }
  $('back').hidden = false;
  $('logo').hidden = true;
  $('cim').textContent = (t.szam ? t.szam + ' ' : '') + (t.fuvaros || 'kamion');
  const sz = szamol(t);
  const rend = [], by = {};
  tetelek(t).forEach(it => {
    const nev = (it.gyarto || '—').trim() || '—';
    const k = nev.toLowerCase();
    if (!by[k]) { by[k] = {nev: nev, lista: []}; rend.push(by[k]); }
    by[k].lista.push(it);
  });
  $('main').innerHTML = '<div class="sync" id="sync"></div>'
    + `<div class="tsum" style="padding:0 0 10px">
        <span class="s-ok">✓ ${sz.ok}</span>
        <span class="s-hiba">⚠ ${sz.hiba}</span>
        <span class="s-nincs">✖ ${sz.nincs}</span>
        <span>${sz.nincs_meg} hátra</span></div>`
    + rend.map(g => `<div class="grp"><div class="ghead">${esc(g.nev)}
        <b>${g.lista.length} tétel</b></div>`
        + g.lista.map(tetelKartya).join('') + '</div>').join('');
  allapotSav();
  document.querySelectorAll('.states button').forEach(b =>
    b.addEventListener('click', () => valaszt(b.dataset.id, b.dataset.a)));
  document.querySelectorAll('.note button').forEach(b =>
    b.addEventListener('click', () => hibaLap(b.dataset.mod)));
}

function rajzol(){
  if (nyitott) tetelLista(); else kamionLista();
  const m = $('main');
  if (m) m.scrollTop = 0;
}

function tetel(id){
  for (const t of kamionok()) {
    const it = tetelek(t).find(x => x.id === id);
    if (it) return it;
  }
  return null;
}

/* ------------------------------------------------ állapotváltás --------- */

function valaszt(id, a){
  if (!raktaros) { nevLap(() => valaszt(id, a)); return; }
  const regi = allapotok[id] || {};
  if (regi.allapot === a && a !== 'hiba') {
    delete allapotok[id];
    ir(TAR, allapotok);
    rajzol();
    return;
  }
  if (a === 'hiba') { hibaLap(id); return; }
  allapotok[id] = {allapot: a, ido: new Date().toISOString()};
  ir(TAR, allapotok);
  const it = tetel(id);
  if (it) jelent(it, allapotok[id]);
  rajzol();
}

/* ------------------------------------------------ hiba-ablak ------------ */

let fotok = [];

function hibaLap(id){
  const it = tetel(id);
  if (!it) return;
  if (!raktaros) { nevLap(() => hibaLap(id)); return; }
  const regi = allapotok[id] || {};
  szerk = id;
  fotok = (regi.fotok || []).slice();
  $('lapsub').textContent = it.termek + ' — ' + (it.ugyfel || '');
  $('megj').value = regi.megjegyzes || '';
  $('opts').innerHTML = HIBAK.map(([k, nev]) =>
    `<label class="opt" data-sel="${regi.hiba === k ? 1 : 0}">
      <input type="radio" name="hiba" value="${k}"
        ${regi.hiba === k ? 'checked' : ''}><span>${esc(nev)}</span></label>`
  ).join('');
  document.querySelectorAll('#opts input').forEach(r =>
    r.addEventListener('change', () => {
      document.querySelectorAll('#opts .opt').forEach(o =>
        o.dataset.sel = o.querySelector('input').checked ? '1' : '0');
    }));
  fotoElonezet();
  $('lap').hidden = false;
}

function fotoElonezet(){
  $('elonezet').innerHTML = fotok.map((f, i) =>
    `<figure><img src="${f}" alt="fotó ${i + 1}">
      <button type="button" data-i="${i}" aria-label="Fotó törlése">✕</button>
     </figure>`).join('');
  document.querySelectorAll('.elonezet button').forEach(b =>
    b.addEventListener('click', () => {
      fotok.splice(Number(b.dataset.i), 1);
      fotoElonezet();
    }));
}

function kicsinyit(file, max = 1280, minoseg = 0.72){
  return new Promise(kesz => {
    const olvaso = new FileReader();
    olvaso.onload = () => {
      const kep = new Image();
      kep.onload = () => {
        let {width: w, height: h} = kep;
        const ar = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * ar); h = Math.round(h * ar);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(kep, 0, 0, w, h);
        try { kesz(c.toDataURL('image/jpeg', minoseg)); }
        catch (e) { kesz(olvaso.result); }
      };
      kep.onerror = () => kesz('');
      kep.src = olvaso.result;
    };
    olvaso.onerror = () => kesz('');
    olvaso.readAsDataURL(file);
  });
}

$('fotobtn').addEventListener('click', () => $('foto').click());
$('foto').addEventListener('change', async e => {
  const fajlok = Array.from(e.target.files || []).slice(0, 3);
  $('fotobtn').textContent = 'Kép feldolgozása…';
  for (const f of fajlok) {
    const kep = await kicsinyit(f);
    if (kep) fotok.push(kep);
  }
  fotok = fotok.slice(0, 3);
  $('fotobtn').innerHTML = '<span aria-hidden="true">📷</span> Fotó hozzáadása';
  e.target.value = '';
  fotoElonezet();
});

$('lapmegse').addEventListener('click', () => { $('lap').hidden = true; });
$('lap').addEventListener('click', e => {
  if (e.target === $('lap')) $('lap').hidden = true;
});
$('lapok').addEventListener('click', () => {
  const be = document.querySelector('#opts input:checked');
  if (!be) {
    document.querySelectorAll('#opts .opt').forEach(o =>
      o.style.borderColor = 'var(--no)');
    return;
  }
  allapotok[szerk] = {
    allapot: 'hiba', hiba: be.value,
    megjegyzes: $('megj').value.trim(),
    fotok: fotok.slice(), ido: new Date().toISOString()
  };
  ir(TAR, allapotok);
  const it = tetel(szerk);
  if (it) jelent(it, allapotok[szerk]);
  $('lap').hidden = true;
  rajzol();
});

/* ------------------------------------------------ név ------------------- */

let nevUtan = null;

function nevLap(utan){
  nevUtan = utan || null;
  $('nevmezo').value = raktaros || '';
  $('nevlap').hidden = false;
  setTimeout(() => $('nevmezo').focus(), 50);
}

$('nevbtn').addEventListener('click', () => nevLap());
$('nevmegse').addEventListener('click', () => { $('nevlap').hidden = true; });
$('nevok').addEventListener('click', () => {
  const n = $('nevmezo').value.trim();
  if (!n) { $('nevmezo').style.borderColor = 'var(--no)'; return; }
  raktaros = n;
  ir(NEV, raktaros);
  $('nevbtn').textContent = n.split(' ')[0];
  $('nevlap').hidden = true;
  const u = nevUtan; nevUtan = null;
  if (u) u();
});

$('back').addEventListener('click', () => { nyitott = null; rajzol(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('lap').hidden) $('lap').hidden = true;
  else if (!$('nevlap').hidden) $('nevlap').hidden = true;
  else if (nyitott) { nyitott = null; rajzol(); }
});
