<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#122B5D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151E2F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuvarnapló">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Terrakotta Fuvarnapló</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F3F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --ink:#16202F; --muted:#63718B; --line:#DCE3EC;
  --navy:#122B5D; --teal:#1E8FA0; --teal-soft:#E4F1F4;
  --ok:#2F8C56; --ok-bg:#E4F2E9;
  --wait:#B57B0A; --wait-bg:#FBF0D9;
  --no:#BC2E24; --no-bg:#FAE3E1;
  --shadow:0 1px 2px rgba(18,43,93,.07), 0 6px 18px rgba(18,43,93,.06);
  --bar:60px;
  /* kamionfejlec sav */
  --band:#12315F; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.74);
  --band-num:#6FD3E4; --band-track:rgba(255,255,255,.24);
  --band-p:#9A6A0C; --band-p-ink:#FFFFFF; --band-p-soft:rgba(255,255,255,.76);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1422; --surface:#151E2F; --surface-2:#1C2739;
    --ink:#E6ECF5; --muted:#92A2BC; --line:#27334A;
    --navy:#8FB0E8; --teal:#4FC3D6; --teal-soft:#16303A;
    --ok:#6BC98C; --ok-bg:#16301F;
    --wait:#E0AE44; --wait-bg:#33260C;
    --no:#F08379; --no-bg:#361714;
    --band:#233860; --band-ink:#E6ECF5; --band-soft:#9DAFCB;
    --band-num:#4FC3D6; --band-track:#2C3C57;
    --band-p:#3A2B0D; --band-p-ink:#E8C578;
    --band-p-soft:#C2A263;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1422; --surface:#151E2F; --surface-2:#1C2739;
  --ink:#E6ECF5; --muted:#92A2BC; --line:#27334A;
  --navy:#8FB0E8; --teal:#4FC3D6; --teal-soft:#16303A;
  --ok:#6BC98C; --ok-bg:#16301F;
  --wait:#E0AE44; --wait-bg:#33260C;
  --no:#F08379; --no-bg:#361714;
  --band:#233860; --band-ink:#E6ECF5; --band-soft:#9DAFCB;
    --band-num:#4FC3D6; --band-track:#2C3C57;
    --band-p:#3A2B0D; --band-p-ink:#E8C578;
    --band-p-soft:#C2A263;
    --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
/* Csak a lista gorogjon: iOS-en a billentyuzet felnyitasakor kulonben az
   egesz lap elcsuszik, es a kereso besiklik a fejlec ala. */
html,body{height:100%; height:100dvh}
body{
  overflow:hidden; overscroll-behavior:none;
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Barlow","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.4;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
.app{display:flex; flex-direction:column; height:100%}

/* ---------- fejléc ---------- */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--navy); color:#fff; padding:10px 16px 9px;
  display:grid; grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center; gap:1px 10px;
}
.logo{grid-column:1; grid-row:1 / span 2; display:flex;
  align-items:center; justify-content:center; width:38px; height:38px;
  background:#fff; border-radius:9px; padding:4px}
.logo img{width:100%; height:100%; object-fit:contain; display:block}
.logo:empty, .logo.nincs{display:none}
:root[data-theme="dark"] header,
:root:not([data-theme="light"]) header{background:var(--surface)}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) header{background:#122B5D}
}
header h1{
  grid-column:2; grid-row:1; margin:0; font-family:"Barlow Condensed","Barlow",sans-serif;
  font-weight:700; font-size:19px; letter-spacing:.04em;
  text-transform:uppercase; color:#fff;
}
:root[data-theme="dark"] header h1{color:var(--ink)}
header .stamp{grid-column:2; grid-row:2; font-size:11.5px; opacity:.72;
  color:#fff; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
:root[data-theme="dark"] header .stamp{color:var(--muted); opacity:1}

main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
     -webkit-overflow-scrolling:touch; scroll-padding-top:74px;
     padding:14px 16px calc(var(--bar) + env(safe-area-inset-bottom,0px) + 18px)}

/* ---------- kamionkártya ---------- */
.truck{background:var(--surface); border:1px solid var(--line); border-radius:10px;
       box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden}
/* A kamion fejlece sotet sav — igy elvalik a rendelesi soroktol. */
.truck > summary, .truck > .thead{
  list-style:none; cursor:pointer; padding:11px 14px;
  display:grid; grid-template-columns:1fr auto; gap:3px 12px;
  background:var(--band); color:var(--band-ink)}
.truck > .thead{cursor:default}
.truck > summary::-webkit-details-marker{display:none}
.truck > summary::marker{content:''}
.truck > summary:focus-visible{outline:2px solid var(--teal);
  outline-offset:-2px}
.tname{font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:600;
       font-size:18px; letter-spacing:.02em; color:var(--band-ink);
       overflow-wrap:anywhere}
.tnum{color:var(--band-num); margin-right:6px; font-weight:700}
.teta{font-size:12.5px; color:var(--band-soft); grid-column:1}
.tkg{font-variant-numeric:tabular-nums; font-weight:600; font-size:15px;
     text-align:right; grid-column:2; grid-row:1; color:var(--band-ink);
     white-space:nowrap}
.tcount{font-size:12px; color:var(--band-soft); text-align:right;
        grid-column:2; white-space:nowrap}
.meter{grid-column:1 / -1; height:4px; border-radius:2px;
       background:var(--band-track); margin-top:7px; overflow:hidden}
.meter i{display:block; height:100%; border-radius:2px; background:var(--ok)}
.meter.w i{background:var(--wait)} .meter.o i{background:var(--no)}
.free{color:var(--band-soft); font-style:italic}
/* fuggo rendelesek: borostyan sav */
.truck.pend > summary{background:var(--band-p); color:var(--band-p-ink)}
.truck.pend .tname, .truck.pend .tkg{color:var(--band-p-ink)}
.truck.pend .tcount, .truck.pend .teta{color:var(--band-p-soft)}
/* ures kamion: halvanyabb sav */
.truck.free-slot > .thead{background:var(--surface-2); color:var(--muted)}
.truck.free-slot .tname{color:var(--muted)}
.truck.free-slot .tnum{color:var(--muted)}
.truck.free-slot .free, .truck.free-slot .teta{color:var(--muted)}

/* ---------- tételsor ---------- */
.items{border-top:1px solid var(--line)}
.grp + .grp{border-top:3px solid var(--surface-2)}
.ghead{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:6px 14px 5px; background:var(--surface-2); color:var(--navy);
  font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:700;
  font-size:14.5px; line-height:1.2; text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--line); overflow-wrap:anywhere}
.ghead b{font-family:"Barlow","Segoe UI",sans-serif; font-weight:500; font-size:11.5px;
  color:var(--muted); text-transform:none; letter-spacing:0; white-space:nowrap}
/* Telefonon minden egymas ala kerul — a jelzesek sajat sorba, igy semmi
   nem csuszik egymasra es nem torik betunkent. */
.row{display:flex; flex-direction:column; gap:2px;
     padding:9px 14px; border-bottom:1px solid var(--line)}
.grp .row:last-child{border-bottom:none}
.prod{font-weight:500; overflow-wrap:anywhere}
.meta{font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
.side{display:flex; flex-wrap:wrap; align-items:center; gap:5px 8px;
      margin-top:3px; min-width:0}
.side:empty{display:none}
.dates{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:2px}
.date{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;
      line-height:1.35}
/* a gyartasi datum ugyanugy nez ki, mint az elerhetoseg cimke */
.chip, .side .date, .date.dgy, .date.dwt{font-size:12px; font-weight:600;
      padding:2px 8px; border-radius:999px; display:inline-flex;
      align-items:center; gap:4px; font-variant-numeric:normal;
      line-height:1.45}
.chip{white-space:nowrap; max-width:100%}
.side .date{background:var(--surface-2); color:var(--muted);
  max-width:100%; white-space:normal; text-align:left}
.date.dgy{color:var(--no); background:var(--no-bg)}
.date.dwt{color:var(--wait); background:var(--wait-bg)}

/* Szelesebb kepernyon visszaall a ket oszlop: balra a tetel, jobbra a
   jelzesek. */
@media (min-width:760px){
  .row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,auto);
       gap:2px 12px; align-items:start}
  .prod, .meta, .dates{grid-column:1}
  .side{grid-column:2; grid-row:1 / span 3; flex-direction:column;
        align-items:flex-end; gap:4px; margin-top:0;
        max-width:min(38%, 220px)}
  .side .date{text-align:right}
}
.c-ok{background:var(--ok-bg); color:var(--ok)}
.c-wait{background:var(--wait-bg); color:var(--wait)}
.c-no{background:var(--no-bg); color:var(--no)}
.c-flag{background:var(--surface-2); color:var(--muted); font-weight:500}

h2.sec{font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:600;
       text-transform:uppercase; letter-spacing:.07em; font-size:13px;
       color:var(--muted); margin:18px 0 8px}

/* ---------- keresés ---------- */
.searchwrap{position:sticky; top:-14px; z-index:10;
            background:var(--ground);
            margin:-14px -16px 0; padding:14px 16px 10px;
            border-bottom:1px solid var(--line)}
input[type=search]{
  width:100%; font:inherit; font-size:16px; padding:10px 12px;
  border:1px solid var(--line); border-radius:9px;
  background:var(--surface); color:var(--ink);
}
input[type=search]:focus{outline:2px solid var(--teal); outline-offset:-1px; border-color:var(--teal)}
.filters{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap}
.filters button{font:inherit; font-size:12.5px; font-weight:500; padding:4px 11px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--muted); cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--teal-soft); border-color:var(--teal);
  color:var(--teal); font-weight:600}
.count{font-size:12px; color:var(--muted); margin:2px 0 8px}
.hit{background:var(--surface); border:1px solid var(--line); border-radius:9px;
     padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow)}
.hit .cust{font-weight:600}
.hit .gy{font-family:"Barlow Condensed","Barlow",sans-serif; font-weight:700;
  font-size:20px; line-height:1.1; letter-spacing:.3px; text-transform:uppercase;
  color:var(--navy); overflow-wrap:anywhere}
.hit .ug{font-size:14.5px; font-weight:600; color:var(--ink); margin-top:1px;
  overflow-wrap:anywhere}
.hit .st{font-size:12.5px; color:var(--teal); margin-top:2px; font-weight:500}
.hit .st.pend{color:var(--wait)}
.hit .toprow{display:flex; justify-content:space-between; gap:5px 10px;
  align-items:flex-start; flex-wrap:wrap}
.hit .toprow > .st{flex:1 1 60%; min-width:0}
.hit .toprow > .side{margin-top:0; justify-content:flex-start}
.hit .gy{flex:1 1 auto; min-width:0}
.empty{color:var(--muted); text-align:center; padding:30px 0}

/* ---------- jelmagyarázat ---------- */
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted);
        padding:10px 12px; background:var(--surface); border:1px solid var(--line);
        border-radius:9px; margin-bottom:14px}
.legend span{display:inline-flex; align-items:center; gap:5px}

/* ---------- alsó sáv ---------- */
nav{position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:grid; grid-template-columns:repeat(3,1fr);
    background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{font:inherit; font-size:12.5px; font-weight:600; letter-spacing:.02em;
  background:none; border:none; color:var(--muted); cursor:pointer;
  height:var(--bar); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; border-top:2px solid transparent; margin-top:-1px}
nav button[aria-selected="true"]{color:var(--teal); border-top-color:var(--teal)}
nav .glyph{font-family:"Barlow Condensed",sans-serif; font-size:16px; font-weight:700;
  letter-spacing:.06em}

/* ---------- asztalra gomb + utmutato ---------- */
.inst{font:inherit; font-size:12.5px; font-weight:600; line-height:1;
  padding:6px 11px; border-radius:999px; cursor:pointer;
  border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.12);
  color:#fff; white-space:nowrap; grid-column:3; grid-row:1 / span 2;
  justify-self:end}
@media (max-width:380px){ .inst-txt{display:none} .inst{font-size:15px} }
.inst:active{background:rgba(255,255,255,.25)}
:root[data-theme="dark"] .inst{border-color:var(--line); color:var(--ink);
  background:var(--surface-2)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .inst{border-color:var(--line);
    color:var(--ink); background:var(--surface-2)}
}
.sheetwrap{position:fixed; inset:0; z-index:40; display:flex;
  align-items:flex-end; justify-content:center;
  background:rgba(10,18,32,.55); padding:0}
.sheet{background:var(--surface); color:var(--ink); width:100%;
  max-width:560px; border-radius:14px 14px 0 0; padding:18px 18px
  calc(18px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow)}
.sheet h3{margin:0 0 10px; font-family:"Barlow Condensed","Barlow",sans-serif;
  font-size:19px; letter-spacing:.02em; text-transform:uppercase;
  color:var(--navy)}
:root[data-theme="dark"] .sheet h3{color:var(--ink)}
.sheet ol{margin:0; padding-left:20px; display:flex; flex-direction:column;
  gap:7px; font-size:14.5px}
.sheet .ikon{display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:22px; padding:0 5px; border-radius:6px;
  background:var(--surface-2); color:var(--teal); font-weight:700;
  margin:0 2px; vertical-align:-5px}
.howto-note{font-size:12.5px; color:var(--muted); margin:12px 0 0}
.sheet-ok{margin-top:14px; width:100%; font:inherit; font-weight:600;
  font-size:15px; padding:11px; border-radius:10px; border:none;
  background:var(--navy); color:#fff; cursor:pointer}
:root[data-theme="dark"] .sheet-ok{background:var(--teal); color:#08222A}
@media (min-width:560px){
  .sheetwrap{align-items:center}
  .sheet{border-radius:14px; margin:16px}
}

@media (prefers-reduced-motion:no-preference){
  .truck{transition:box-shadow .15s ease}
}

/* ---------- nagyobb kepernyon kozepre ---------- */
@media (min-width:760px){
  .app{max-width:760px; margin:0 auto; background:var(--ground)}
  nav{max-width:760px; margin:0 auto}
  header{border-radius:0}
  main{padding-left:20px; padding-right:20px}
  .searchwrap{margin-left:-20px; margin-right:-20px;
              padding-left:20px; padding-right:20px}
}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kg = n => Number(n || 0).toLocaleString('hu-HU') + ' kg';
const CAP = 24000;
const WAIT = '↻';

function chip(v){
  if (v === '✓') return '<span class="chip c-ok">✓ elérhető</span>';
  if (v === '↻') return '<span class="chip c-wait">↻ bekérve</span>';
  if (v === '✗') return '<span class="chip c-no">✗ nem elérhető</span>';
  return '';
}
function splitTitle(t){
  const p = String(t).split('—');
  const left = (p[0] || '').trim();
  const m = left.match(/^(\d+)\.\s*(.*)$/);
  return {num: m ? m[1] : '', name: (m ? m[2] : left).trim(),
          eta: (p[1] || '').trim()};
}
const LEGEND = `<div class="legend">
  <span><span class="chip c-ok">✓</span> elérhető</span>
  <span><span class="chip c-wait">↻</span> pakolásra bekérve</span>
  <span><span class="chip c-no">✗</span> nem elérhető</span>
  <span><span class="date dgy">2026.09.20.</span> gyártási dátum</span>
</div>`;

function gyCls(mark){
  if (mark === '✗') return 'date dgy';     // piros: nem elérhető
  if (mark === WAIT) return 'date dwt';    // sárga: pakolásra bekérve
  return 'date';                           // egyébként semleges
}

function gyBadge(it){
  return it.gyartasi
    ? `<span class="${gyCls(it.elerhetoseg)}" title="gyártási dátum"
        >${esc(it.gyartasi)}</span>` : '';
}

function itemRow(it){
  const meta = [it.ugyfel, it.megjegyzes].filter(Boolean).join(' · ');
  return `<div class="row">
    <div class="prod">${esc(it.termek)}</div>
    ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
    ${it.leadva ? `<div class="dates"><span class="date">leadva
      ${esc(it.leadva)}</span></div>` : ''}
    <div class="side">${chip(it.elerhetoseg)}${gyBadge(it)}</div></div>`;
}

function itemList(items){
  const order = [], by = {};
  items.forEach(it => {
    const name = (it.gyarto || '—').trim() || '—';
    const k = name.toLowerCase();
    if (!by[k]) { by[k] = {name: name, items: []}; order.push(by[k]); }
    by[k].items.push(it);
  });
  return `<div class="items">${order.map(g =>
    `<div class="grp"><div class="ghead">${esc(g.name)}<b>${g.items.length} tétel</b></div>`
    + g.items.map(itemRow).join('') + '</div>').join('')}</div>`;
}

function truckCard(t, open){
  const s = splitTitle(t.title);
  const pct = Math.round(t.kg / CAP * 100);
  const cls = pct > 100 ? 'o' : (pct >= 90 ? 'w' : '');
  if (!t.items.length) {
    return `<div class="truck free-slot"><div class="thead">
      <div class="tname"><span class="tnum">${esc(s.num)}</span>
      <span class="free">szabad hely</span></div>
      <div class="teta">még nincs ide osztva tétel</div></div></div>`;
  }
  return `<details class="truck"${open ? ' open' : ''}>
    <summary>
      <div class="tname"><span class="tnum">${esc(s.num)}</span>${esc(s.name)}</div>
      <div class="tkg">${kg(t.kg)}</div>
      <div class="teta">${esc(s.eta)}</div>
      <div class="tcount">${t.items.length} tétel · ${pct}%</div>
      <div class="meter ${cls}"><i style="width:${Math.min(pct,100)}%"></i></div>
    </summary>
    ${itemList(t.items)}
  </details>`;
}

function countryView(key){
  const d = DATA[key];
  const used = d.trucks.filter(t => t.items.length);
  const free = d.trucks.filter(t => !t.items.length);
  let h = LEGEND + '<h2 class="sec">Kiosztott kamionok</h2>';
  h += used.map((t, i) => truckCard(t, i === 0)).join('');
  h += free.map(t => truckCard(t, false)).join('');
  const p = d.pending;
  const pkg = p.reduce((a, x) => a + (parseInt(x.tomeg, 10) || 0), 0);
  h += `<h2 class="sec">Függő rendelések</h2>
    <details class="truck pend"><summary>
      <div class="tname">Még nincs kamionra osztva</div>
      <div class="tkg">${kg(pkg)}</div>
      <div class="tcount">${p.length} tétel</div>
    </summary>${itemList(p)}</details>`;
  return h;
}

let q = '', filter = 'all';
function searchView(){
  return `<div class="searchwrap">
      <input type="search" id="q" placeholder="Vásárló, gyártó vagy termék…"
             autocomplete="off" value="${esc(q)}">
      <div class="filters" id="filters">
        ${[['all','Mind'],['SPANYOL','Spanyol'],['OLASZ','Olasz'],
           ['fuggo','Csak függő']].map(([v,l]) =>
          `<button data-f="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}
      </div></div>
    <div id="results"></div>`;
}
function runSearch(){
  const needle = q.trim().toLowerCase();
  let rows = DATA.all;
  if (filter === 'fuggo') rows = rows.filter(r => r.fuggo);
  else if (filter !== 'all') rows = rows.filter(r => r.orszag === filter);
  if (needle) rows = rows.filter(r =>
    (r.ugyfel + ' ' + r.gyarto + ' ' + r.termek + ' ' + r.proforma)
      .toLowerCase().includes(needle));
  const el = document.getElementById('results');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<p class="empty">Nincs találat.</p>'; return; }
  el.innerHTML = `<p class="count">${rows.length} találat</p>` +
    rows.slice(0, 300).map(r => {
      const s = splitTitle(r.allapot);
      const st = r.fuggo
        ? 'Függő rendelés — még nincs kamionon'
        : [s.num ? s.num + '. kamion' : '', s.name, s.eta]
            .filter(Boolean).join(' · ');
      return `<div class="hit">
      <div class="toprow"><div class="gy">${esc(r.gyarto || '—')}</div>
        <span class="chip c-flag">${esc(r.orszag)}</span></div>
      <div class="prod">${esc(r.termek)}</div>
      <div class="ug">${esc(r.ugyfel || '—')}</div>
      <div class="toprow" style="margin-top:5px">
        <div class="st${r.fuggo ? ' pend' : ''}">${esc(st)}
          ${r.leadva ? `<span class="date" style="margin-left:8px"
            >leadva ${esc(r.leadva)}</span>` : ''}</div>
        <div class="side">${chip(r.elerhetoseg)}${gyBadge(r)}</div></div>
    </div>`; }).join('') +
    (rows.length > 300 ? '<p class="count">Csak az első 300 találat látszik — szűkíts.</p>' : '');
}

const TABS = {es:'tab-es', it:'tab-it', q:'tab-q'};
let tab = 'es';
function render(){
  const main = document.getElementById('main');
  main.innerHTML = tab === 'q' ? searchView() : countryView(tab);
  main.scrollTop = 0;
  Object.entries(TABS).forEach(([k, id]) =>
    document.getElementById(id).setAttribute('aria-selected', String(k === tab)));
  if (tab === 'q') {
    const input = document.getElementById('q');
    input.addEventListener('input', e => { q = e.target.value; runSearch(); });
    document.getElementById('filters').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      filter = b.dataset.f;
      [...e.currentTarget.children].forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      runSearch();
    });
    runSearch();
  }
  try { localStorage.setItem('tk-tab', tab); } catch (e) {}
}
Object.entries(TABS).forEach(([k, id]) =>
  document.getElementById(id).addEventListener('click', () => { tab = k; render(); }));
function stampText(v){
  try {
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return new Intl.DateTimeFormat('hu-HU', {
      timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(d).replace(/,/g, '');
  } catch (e) { return String(v); }
}
document.getElementById('stamp').textContent =
  'frissítve: ' + stampText(DATA.generated) + ' (magyar idő)';
try { const t = localStorage.getItem('tk-tab'); if (t && TABS[t]) tab = t; } catch (e) {}
render();

/* ---------- Telepites: Android/Chrome, iOS-en utmutato --------------- */
(function(){
  const btn = document.getElementById('inst');
  const wrap = document.getElementById('howto');
  const lista = document.getElementById('howto-lepesek');
  if (!btn || !wrap || !lista) return;
  let varakozo = null;                 // a Chrome telepitesi ajanlata

  const ua = navigator.userAgent || '';
  const ios = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const iosChrome = ios && /CriOS|FxiOS|EdgiOS/.test(ua);
  const android = /Android/.test(ua);
  const telepitve = (window.matchMedia
      && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;

  const I = s => '<span class="ikon">' + s + '</span>';
  function lepesek(){
    if (ios) return [
      'Koppints a <b>Megosztás</b> gombra ' + I('&#x2191;')
        + (iosChrome ? ' a címsor mellett.' : ' a böngésző alsó sávjában.'),
      'Görgess le, és válaszd: <b>Add to Home Screen</b> '
        + '(magyarul: <b>Hozzáadás a főképernyőhöz</b>).',
      'Koppints a jobb felső <b>Hozzáadás</b> gombra.'];
    if (android) return [
      'Koppints a böngésző <b>menüjére</b> ' + I('&#8942;') + '.',
      'Válaszd: <b>Hozzáadás a kezdőképernyőhöz</b> vagy '
        + '<b>Alkalmazás telepítése</b>.',
      'Erősítsd meg a <b>Hozzáadás</b> gombbal.'];
    return [
      'A böngésző címsorának jobb szélén koppints a telepítés ikonra '
        + I('&#x2295;') + ', vagy nyisd meg a menüt ' + I('&#8942;') + '.',
      'Válaszd: <b>Alkalmazás telepítése</b> / <b>Install</b>.'];
  }
  function mutat(){
    lista.innerHTML = lepesek().map(x => '<li>' + x + '</li>').join('');
    wrap.hidden = false;
  }
  function rejt(){ wrap.hidden = true; }

  document.getElementById('howto-ok').addEventListener('click', rejt);
  wrap.addEventListener('click', e => { if (e.target === wrap) rejt(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !wrap.hidden) rejt();
  });

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    varakozo = e;
    btn.hidden = telepitve;
  });
  window.addEventListener('appinstalled', () => {
    varakozo = null; btn.hidden = true; rejt();
  });

  btn.addEventListener('click', async () => {
    if (varakozo) {
      varakozo.prompt();
      try {
        const v = await varakozo.userChoice;
        if (v && v.outcome === 'accepted') btn.hidden = true;
      } catch (e) {}
      varakozo = null;
      return;
    }
    mutat();
  });

  if (!telepitve) btn.hidden = false;   // utmutato mindig elerheto

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();

</script>
